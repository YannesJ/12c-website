{% comment %}
  Dane strukturalne polskiej strony o Androidzie. Leżą jako include, żeby
  layout mógł podać je w <head>. Pytania w bloku FAQPage muszą zostać słowo
  w słowo takie same jak wiersze <summary> w pl/android.html, inaczej Google
  odrzuci znaczniki.
{% endcomment %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "12 Challenges",
        "item": "{{ '/pl/' | absolute_url }}"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Android",
        "item": "{{ page.url | absolute_url }}"
      }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Czy jest 12 Challenges na Androida?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "W tej chwili nie. Aplikacja działa wyłącznie na iPhonie. Wersja na Androida nie jest ani gotowa, ani w budowie: leży na liście i czeka, aż pojawi się zapotrzebowanie."
        }
      },
      {
        "@type": "Question",
        "name": "Czy powstanie wersja na Androida?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Możliwe, ale niczego nie obiecuję. Celowo nie podaję daty, bo nie dałbym rady jej dotrzymać. Decyzja zależy po prostu od tego, ile osób o nią poprosi."
        }
      },
      {
        "@type": "Question",
        "name": "Czy aplikacja jest w Google Play?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Nie. 12 Challenges nie ma w Google Play i nie ma też oficjalnego pliku APK do samodzielnej instalacji. Jeśli natkniesz się gdzieś na taki plik, nie pochodzi ode mnie."
        }
      },
      {
        "@type": "Question",
        "name": "Czy jest wersja w przeglądarce?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Też nie. Aplikacja trzyma wszystko lokalnie na urządzeniu, bez konta i bez serwera, a tego w przeglądarce praktycznie nie da się odtworzyć. Wersja w przeglądarce oznaczałaby rejestrację, serwery i twoje dane u mnie. Wolę tego uniknąć."
        }
      },
      {
        "@type": "Question",
        "name": "Co daje kliknięcie przycisku na tej stronie?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Szczerze mówiąc nic, co mógłbym policzyć. Kliknięcie zostaje w twojej przeglądarce, strona niczego do mnie nie wysyła. Liczy się samo wyszukiwanie, które cię tu przywiodło: to widzę w statystykach i to jest cały powód, dla którego ta strona istnieje."
        }
      }
    ]
  }
  </script>
