        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sí. Además de las apps con suscripción, hay trackers totalmente gratis o de pago único. Para saber si una app tiene suscripción, mira Compras dentro de la app en el apartado Información de su página en el App Store. 12 Challenges es una de las apps sin suscripción: lo básico es gratis y la mejora Pro opcional se paga una sola vez."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cómo sé si una app tiene suscripción?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "En la página de la app en el App Store, dentro de Información, la línea Compras dentro de la app muestra todos los precios. Nombres como Mensual, Anual o una duración entre paréntesis indican una suscripción. Un único precio con un nombre como Pro o De por vida apunta a un pago único."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cuánto cuesta 12 Challenges?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "La descarga y lo básico son gratis: crear y marcar challenges, los recordatorios, la sincronización con tu iCloud y el widget de la pantalla de inicio. La mejora Pro opcional se paga una vez. En España cuesta 4,79 € y la versión Supporter 7,99 €. En otros países el App Store te muestra el precio local. Las dos versiones desbloquean la app para Apple Watch, las estadísticas y el archivo completo."
        }
      },
      {
        "@type": "Question",
        "name": "¿La prueba de 12 Challenges se renueva sola?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Los siete días de Pro empiezan al instalar la app y terminan solos. Después, la app sigue funcionando con las funciones gratuitas. No hay ninguna suscripción que pueda renovarse ni nada que tengas que cancelar."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cómo cancelo una suscripción en el iPhone?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Abre Ajustes (Configuración en Latinoamérica), toca tu nombre arriba del todo y luego Suscripciones. Ahí ves todas las suscripciones activas y puedes cancelar cada una por separado. La suscripción sigue activa hasta el final del periodo pagado. Una prueba gratuita conviene cancelarla al menos un día antes de que termine."
        }
      },
      {

        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sí, siempre que uses la misma cuenta de Apple. Los pagos únicos van ligados a tu cuenta de Apple y se restauran al instalar la app en otro dispositivo. Eso incluye la mejora Pro de 12 Challenges."
