  <script type="application/ld+json">

    "mainEntity": [
      {
        "@type": "Question",
        "name": "Existe um habit tracker para iPhone sem assinatura?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sim. Além das apps com assinatura, há trackers totalmente gratuitos ou de compra única. Para saber se uma app tem assinatura, vê a linha Compras integradas na secção Informações da página da app na App Store. O 12 Challenges é uma das apps sem assinatura: o essencial é grátis e a versão Pro opcional paga-se uma única vez."
        }
      },
      {
        "@type": "Question",
        "name": "Como sei se uma app tem assinatura?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Na página da app na App Store, na secção Informações, a linha Compras integradas mostra todos os preços. Nomes como Mensal, Anual ou uma duração entre parênteses indicam uma assinatura. Um único preço com um nome como Pro ou Vitalício aponta para uma compra única."
        }
      },
      {
        "@type": "Question",
        "name": "Quanto custa o 12 Challenges?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Descarregar e o essencial são grátis: criar e marcar challenges, os lembretes, a sincronização através do teu iCloud e o widget do ecrã principal. A versão Pro opcional paga-se uma vez: 4,49 € em Portugal e R$ 19,90 no Brasil. A versão Supporter custa 7,49 € ou R$ 29,90. As duas desbloqueiam a app para Apple Watch, as estatísticas e o arquivo completo."
        }
      },
      {
        "@type": "Question",
        "name": "O período experimental do 12 Challenges renova-se sozinho?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não. Os sete dias de Pro começam quando instalas a app e terminam sozinhos. Depois, a app continua a funcionar com as funções gratuitas. Não há nenhuma assinatura que se possa renovar nem nada que tenhas de cancelar."
        }
      },
      {
        "@type": "Question",
        "name": "Como cancelo uma assinatura no iPhone?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Abre as Definições (Ajustes, no Brasil), toca no teu nome lá em cima e depois em Assinaturas. Ali vês todas as assinaturas ativas e podes cancelar cada uma separadamente. A assinatura continua ativa até ao fim do período pago. Um período experimental deve ser cancelado pelo menos um dia antes de acabar."
        }
      },
      {
        "@type": "Question",
        "name": "Mantenho uma compra única num iPhone novo?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sim, desde que uses a mesma Conta Apple. As compras únicas ficam ligadas à tua Conta Apple e são restauradas quando instalas a app noutro dispositivo. Isso inclui a versão Pro do 12 Challenges."
        }
      },
      {
        "@type": "Question",
        "name": "Preciso de conta para usar o 12 Challenges?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não. A app funciona sem registo e sem iniciar sessão. Os teus challenges ficam guardados no teu iPhone. Se quiseres, a app também os pode guardar no teu próprio iCloud."
        }
      }
    ]
