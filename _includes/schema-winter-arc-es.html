  <script type="application/ld+json">

    "@context": "https://schema.org",

    "mainEntity": [
      {
        "@type": "Question",
        "name": "¿Qué significa Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "El término viene del character arc, el arco narrativo de las series y el anime que lleva a un personaje a través de un cambio. Llevado al día a día significa esto: tomas la mitad oscura del año como un periodo fijo para cambiar algo a propósito, en lugar de dejarla pasar. El núcleo siempre es el mismo: un inicio claro, un final definido y reglas diarias fijas entre medias."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cuándo empieza el Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Lo habitual es el 1 de octubre, lo que da unos 90 días hasta Nochevieja. No es obligatorio: hay quien empieza el 1 de noviembre y quien lo alarga hasta finales de enero. Aun así una fecha fija ayuda, porque un periodo sin principio claro es difícil de medir."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cuánto dura un Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Normalmente 90 días, es decir unos tres meses de octubre a diciembre. Si te parece largo, eso es información útil y no una señal de debilidad. Tres bloques separados de 30 días cubren el mismo periodo y te dan dos metas intermedias de más."
        }
      },
      {
        "@type": "Question",
        "name": "¿Qué reglas tiene el Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No hay reglas oficiales, porque nadie administra el trend. Las más repetidas son: madrugar, entrenar con regularidad, comer de forma más consciente, mantener horarios de sueño fijos, reducir el tiempo de pantalla y escribir un diario. Es más eficaz quedarse con dos o tres que con las seis. Una regla que no cumples no es una regla."
        }
      },
      {
        "@type": "Question",
        "name": "¿Qué se hace durante un Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Repites cada día las mismas tareas fijadas, con un tamaño lo bastante pequeño para que sigan siendo posibles en un mal día. Puede ser deporte, lectura, acostarse antes o dejar el móvil por la noche. Lo decisivo no es el tema, sino que por la noche puedas responder con un sí o un no claro."
        }
      },
      {
        "@type": "Question",
        "name": "¿El Winter Arc es solo cosa de deporte?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No, esa es solo la parte más visible. Como los vídeos de entrenamiento son los que más alcance tienen, por fuera parece un asunto puramente de fitness. El mecanismo funciona igual para el sueño, la lectura, las finanzas o el orden. Lo decisivo es que tu meta se pueda repetir a diario."
        }
      },
      {
        "@type": "Question",
        "name": "¿Para qué sirve un Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Al final tienes tres meses en los que has construido rutinas, en lugar de tres meses que apenas recuerdas. Qué sale exactamente de ahí depende de tu meta, y eso nadie te lo puede prometer en serio. La ganancia real es el momento: llegas a enero con algo ya en marcha en vez de empezar de cero."
        }
      },
      {
        "@type": "Question",
        "name": "¿Puedo empezar más tarde del 1 de octubre?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sí. El 1 de octubre es una convención, no un pistoletazo de salida. Quien empieza el 12 de noviembre todavía tiene casi 50 días hasta Nochevieja, suficiente para un challenge completo de 30 días. Esperar a una fecha perfecta del año que viene te cuesta más que empezar tarde."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cómo aguanto un Winter Arc hasta el final?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Deciden tres cosas. Pon la meta lo bastante pequeña para tu peor día, no para el mejor. Divide los 90 días en tres meses para tener un resultado real a los 30 días. Y cuenta con días fallados desde el principio, porque un plan que se cae al primer tropiezo está mal construido."
        }
      },
      {
        "@type": "Question",
        "name": "¿Necesito una app para esto?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Un calendario en la pared y un boli llevan décadas funcionando. En la práctica suele fallar por tres puntos: el calendario está en casa, nadie te avisa y a los dos meses ya nadie recuerda cómo fue octubre. La app de iPhone 12 Challenges entra justo ahí, con recordatorios, widget en la pantalla de inicio y un resumen de cada mes."
        }
      }
    ]
