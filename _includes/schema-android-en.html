{% comment %}
  Structured data for the English Android page. Kept as an include so the
  layout can serve it from the <head>. The questions in the FAQPage block
  must stay word for word identical to the <summary> lines in en/android.html,
  otherwise Google discards the markup.
{% endcomment %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "12 Challenges",
        "item": "{{ '/en/' | absolute_url }}"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Android",
        "item": "{{ page.url | absolute_url }}"
      }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Is 12 Challenges available for Android?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Not right now. The app runs on iPhone only. An Android version is neither finished nor in progress, it sits on the list waiting for the demand to show up."
        }
      },
      {
        "@type": "Question",
        "name": "Will there be an Android version?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Possibly, but nothing is promised. I deliberately give no date, because I could not keep one. The decision comes down to how many people ask for it."
        }
      },
      {
        "@type": "Question",
        "name": "Is the app on the Google Play Store?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. 12 Challenges is not on the Play Store, and there is no official APK file to sideload either. If you come across one under that name, it did not come from me."
        }
      },
      {
        "@type": "Question",
        "name": "Is there a web version in the browser?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Not that either. The app keeps everything locally on your device, with no account and no server, and that is close to impossible to rebuild in a browser. A web version would mean sign-ups, servers and your data sitting with me. I would rather not."
        }
      },
      {
        "@type": "Question",
        "name": "What does clicking the button here actually do?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Honestly, nothing I could count. The click stays in your browser, the page sends nothing to me. What counts is the search you did before: I see that in the search statistics, and it is the whole reason this page exists."
        }
      }
    ]
  }
  </script>
