  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "O que significa Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "O termo vem do character arc, o arco narrativo das séries e do anime que leva uma personagem por uma mudança. Aplicado ao dia a dia significa isto: pegas na metade escura do ano como um período fixo para mudar algo de propósito, em vez de a deixares passar. O núcleo é sempre o mesmo: um início claro, um fim definido e regras diárias fixas pelo meio."
        }
      },
      {
        "@type": "Question",
        "name": "Quando começa o Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Normalmente a 1 de outubro, o que dá cerca de 90 dias até à passagem de ano. Não é obrigatório: há quem comece a 1 de novembro e quem vá até ao fim de janeiro. Mesmo assim uma data fixa ajuda, porque um período sem início claro é difícil de medir."
        }
      },
      {
        "@type": "Question",
        "name": "Quanto tempo dura um Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Na maioria dos casos 90 dias, ou seja cerca de três meses de outubro a dezembro. Se te parecer longo, isso é informação útil e não sinal de fraqueza. Três blocos separados de 30 dias cobrem o mesmo período e dão-te duas metas intermédias a mais."
        }
      },
      {
        "@type": "Question",
        "name": "Que regras tem o Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não existem regras oficiais, porque ninguém gere a tendência. As mais repetidas são: levantar cedo, treinar com regularidade, comer de forma mais consciente, manter horários de sono fixos, reduzir o tempo de ecrã e escrever um diário. É mais eficaz ficares por duas ou três do que pelas seis. Uma regra que não cumpres não é uma regra."
        }
      },
      {
        "@type": "Question",
        "name": "O que se faz durante um Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Repetes todos os dias as mesmas tarefas definidas, com um tamanho pequeno o suficiente para continuarem possíveis num dia mau. Pode ser desporto, leitura, deitar mais cedo ou arrumar o telemóvel à noite. O decisivo não é o tema, mas poderes responder à noite com um sim ou um não claro."
        }
      },
      {
        "@type": "Question",
        "name": "O Winter Arc é só para desporto?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não, essa é apenas a parte mais visível. Como os vídeos de treino são os que têm mais alcance, por fora a tendência parece uma coisa puramente de fitness. O mecanismo funciona igual para o sono, a leitura, as finanças ou a arrumação. O decisivo é que o teu objetivo se possa repetir todos os dias."
        }
      },
      {
        "@type": "Question",
        "name": "Para que serve um Winter Arc?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No fim tens três meses em que construíste rotinas, em vez de três meses de que mal te lembras. O que sai daí em concreto depende do teu objetivo, e isso ninguém te pode prometer a sério. O ganho real é o momento: chegas a janeiro com algo já em andamento em vez de começares do zero."
        }
      },
      {
        "@type": "Question",
        "name": "Posso começar depois de 1 de outubro?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sim. O 1 de outubro é uma convenção, não um tiro de partida. Quem começa a 12 de novembro ainda tem quase 50 dias até à passagem de ano, que chegam para um challenge completo de 30 dias. Esperar por uma data perfeita no próximo ano custa-te mais do que começar tarde."
        }
      },
      {
        "@type": "Question",
        "name": "Como aguento um Winter Arc até ao fim?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Decidem três coisas. Põe o objetivo pequeno o suficiente para o teu pior dia, não para o melhor. Divide os 90 dias em três meses para teres um resultado concreto ao fim de 30 dias. E conta com dias falhados desde o início, porque um plano que se desfaz ao primeiro deslize está mal construído."
        }
      },
      {
        "@type": "Question",
        "name": "Preciso de uma app para isto?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não. Um calendário na parede e uma caneta funcionam há décadas. Na prática costuma falhar em três pontos: o calendário fica em casa, ninguém te lembra e ao fim de dois meses já ninguém sabe como correu outubro. A app de iPhone 12 Challenges entra exatamente aí, com lembretes, widget no ecrã principal e um resumo de cada mês."
        }
      }
    ]
  }
