      {
        "@type": "Question",
        "name": "Is there a habit tracker for iPhone with no subscription?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Alongside subscription apps, there are trackers that are completely free or sold as a one-time purchase. To see whether an app has a subscription, check In-App Purchases under Information on its App Store page. 12 Challenges is one of the apps without a subscription: the basics are free, and the optional Pro upgrade is a one-time purchase."
        }
      },
      {
        "@type": "Question",
        "name": "How can I tell if an app has a subscription?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "On the app's App Store page, In-App Purchases under Information lists every price. Names like Monthly, Yearly or a duration in brackets point to a subscription. A single price with a name like Pro or Lifetime suggests a one-time purchase."
        }
      },
      {
        "@type": "Question",
        "name": "How much does 12 Challenges cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The download and the basics are free: creating and checking off challenges, reminders, syncing through your iCloud and the home screen widget. The optional Pro upgrade is a one-time purchase of $4.99 in the US or £4.99 in the UK. The Supporter version costs $8.99 or £8.99. Both unlock the Apple Watch app, statistics and the full archive."
        }
      },
      {
        "@type": "Question",
        "name": "Does the 12 Challenges trial renew automatically?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. The seven days of Pro start when you install the app and end on their own. After that, the app keeps running with its free features. There's no subscription that could renew and nothing you need to cancel."
        }
      },
      {
        "@type": "Question",
        "name": "How do I cancel an app subscription on iPhone?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Open Settings, tap your name at the top, then Subscriptions. You'll see all active subscriptions there and can cancel each one separately. A subscription stays active until the end of the period you've paid for. Cancel a free trial at least a day before it ends."
        }
      },
      {
        "@type": "Question",
        "name": "Do I keep a one-time purchase on a new iPhone?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, as long as you use the same Apple Account. One-time purchases are tied to your Apple Account and can be restored after you install the app on a new device. That includes the 12 Challenges Pro upgrade."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need an account for 12 Challenges?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. The app works without signing up or logging in. Your challenges are stored on your iPhone. If you like, the app can also keep them in your own iCloud."
        }
