{% assign pullup = site.data.pullup_challenge[page.lang] %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "@id": "{{ page.url | absolute_url }}#article",
  "headline": {{ pullup.h1 | jsonify }},
  "description": {{ page.description | jsonify }},
  "inLanguage": {{ page.lang | jsonify }},
  "image": "{{ page.og_image | absolute_url }}",
  "datePublished": "{{ pullup.published }}",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "author": { "@type": "Organization", "name": "12 Challenges", "url": "{{ '/' | absolute_url }}" },
  "publisher": { "@type": "Organization", "name": "12 Challenges", "url": "{{ '/' | absolute_url }}" }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "12 Challenges", "item": "{{ site.data.pages.home[page.lang] | absolute_url }}" },
    { "@type": "ListItem", "position": 2, "name": {{ pullup.name | jsonify }}, "item": "{{ page.url | absolute_url }}" }
  ]
}
</script>
