<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "@id": "{{ page.url | absolute_url }}",
  "url": "{{ page.url | absolute_url }}",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "inLanguage": "de",
  "image": "{{ '/assets/og-image-de.png' | absolute_url }}",
  "breadcrumb": { "@id": "{{ page.url | absolute_url }}#breadcrumb" },
  "author": { "@type": "Organization", "name": "12 Challenges", "url": "{{ '/' | absolute_url }}" },
  "publisher": { "@type": "Organization", "name": "12 Challenges", "url": "{{ '/' | absolute_url }}" }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "@id": "{{ page.url | absolute_url }}#breadcrumb",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "12 Challenges", "item": "{{ '/' | absolute_url }}" },
    { "@type": "ListItem", "position": 2, "name": "Apple Watch", "item": "{{ page.url | absolute_url }}" }
  ]
}
</script>
