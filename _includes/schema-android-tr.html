{% comment %}
  Türkçe Android sayfasının yapılandırılmış verileri. Include olarak duruyor,
  böylece layout bunları <head> içinde sunabiliyor. FAQPage bloğundaki sorular
  tr/android.html dosyasındaki <summary> satırlarıyla kelimesi kelimesine aynı
  kalmalı, aksi halde Google işaretlemeyi yok sayar.
{% endcomment %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "12 Challenges",
        "item": "{{ '/tr/' | absolute_url }}"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Android",
        "item": "{{ page.url | absolute_url }}"
      }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "12 Challenges'ın Android sürümü var mı?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Şu anda yok. Uygulama sadece iPhone'da çalışıyor. Android sürümü ne hazır ne de yapımda: listede duruyor ve talebin ortaya çıkmasını bekliyor."
        }
      },
      {
        "@type": "Question",
        "name": "Android sürümü gelecek mi?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Mümkün, ama söz vermiyorum. Bilerek tarih vermiyorum, çünkü tutamazdım. Karar tamamen kaç kişinin istediğine bağlı."
        }
      },
      {
        "@type": "Question",
        "name": "Uygulama Google Play Store'da mı?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Hayır. 12 Challenges Play Store'da yok ve kendi başına kurabileceğin resmi bir APK dosyası da yok. Bu isimle bir dosyaya rastlarsan, benden gelmemiştir."
        }
      },
      {
        "@type": "Question",
        "name": "Tarayıcıda bir web sürümü var mı?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "O da yok. Uygulama her şeyi cihazın kendisinde, hesapsız ve sunucusuz saklıyor, bunu bir tarayıcıda kurmak neredeyse imkânsız. Web sürümü demek kayıt, sunucu ve verilerinin bende durması demek olurdu. Bunu istemiyorum."
        }
      },
      {
        "@type": "Question",
        "name": "Buradaki düğmeye basmak ne işe yarıyor?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dürüst olmak gerekirse sayabileceğim hiçbir şeye. Tıklama tarayıcında kalıyor, sayfa bana bir şey göndermiyor. Asıl önemli olan öncesinde yaptığın arama: onu arama istatistiklerinde görüyorum ve bu sayfanın var olma sebebi de zaten bu."
        }
      }
    ]
  }
  </script>
