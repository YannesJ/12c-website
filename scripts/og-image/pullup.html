<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><style>
@font-face{font-family:Bricolage;src:url('{{FONT}}')}@font-face{font-family:Mono;src:url('{{MONO}}')}
*{box-sizing:border-box;margin:0}body{width:1200px;height:630px;overflow:hidden;background:#050505;color:#fff;font-family:Bricolage,sans-serif;padding:58px 64px;display:grid;grid-template-columns:660px 1fr;gap:30px;align-items:center}.brand{font-family:Mono,monospace;font-size:20px;letter-spacing:2px;color:#6be08a;margin-bottom:36px}h1{font-size:64px;line-height:1.08;font-weight:700;overflow-wrap:break-word}p{font-size:27px;line-height:1.4;color:#98a09b;margin-top:22px}.url{font-family:Mono,monospace;font-size:17px;color:#98a09b;margin-top:35px}.art{position:relative;height:490px;overflow:hidden;border-radius:24px;border:1px solid #232527}.art img{display:block;width:100%;height:100%;object-fit:cover}.marks{display:flex;gap:10px;justify-content:center}.marks span{font:22px Mono,monospace;padding:10px;border:1px solid #34373a;border-radius:14px;color:#dfe3e1}
.credit{position:absolute;bottom:12px;right:12px;left:12px;color:#dfe3e1;background:rgba(5,5,5,.85);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.4;text-align:right}
</style></head><body><div><div class="brand">12 CHALLENGES</div><h1>{{NAME}}</h1><p>{{TITLE}}</p><div class="url">12challenges.de</div></div><div class="art"><img src="{{IMAGE}}" alt=""><div class="credit">{{LABEL}}</div></div></body></html>
