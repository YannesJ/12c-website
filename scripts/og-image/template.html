<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Bricolage Grotesque";
    src: url("../../assets/fonts/BricolageGrotesque.woff2") format("woff2");
    font-weight: 200 800;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("../../assets/fonts/JetBrainsMono.woff2") format("woff2");
    font-weight: 400 700;
  }

  :root {
    --black: #050505;
    --surface: #101110;
    --surface-raised: #17181a;
    --border: #232527;
    --border-visible: #34373a;
    --text-secondary: #98a09b;
    --text-primary: #dfe3e1;
    --text-display: #ffffff;
    --accent: #34c759;
    --accent-light: #6be08a;
    --accent-contrast: #04140a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    background: var(--black);
    overflow: hidden;
  }

  body {
    position: relative;
    font-family: "Bricolage Grotesque", sans-serif;
  }

  /* Dot-grid, faded via radial mask centered on the text block (matches
     the falloff measured on assets/og-image-de.png: brightest around
     x=300 y=340, fading out toward the canvas edges). */
  .dot-grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, var(--border-visible) 1px, transparent 1px);
    background-size: 27px 27px;
    background-position: -8px -8px;
    -webkit-mask-image: radial-gradient(ellipse 480px 420px at 300px 340px, #000 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 480px 420px at 300px 340px, #000 0%, transparent 75%);
  }

  .wordmark {
    position: absolute;
    left: 72px;
    top: 172px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .wordmark img { width: 44px; height: 44px; border-radius: 11px; display: block; }
  .wordmark span {
    font-family: "JetBrains Mono";
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.05em;
    color: var(--text-display);
  }

  .headline {
    position: absolute;
    left: 72px;
    top: 246px;
    width: 630px;
    font-weight: 800;
    font-size: 50px;
    line-height: 1.14;
    color: var(--text-display);
    letter-spacing: -0.01em;
  }

  .sub {
    position: absolute;
    left: 72px;
    top: 388px;
    width: 600px;
    font-size: 19px;
    line-height: 1.45;
    color: var(--text-secondary);
  }

  /* --- phone mockup: the same finished image the site uses, just placed
     absolutely for the OG canvas. --- */
  .phone-wrap {
    position: absolute;
    right: 60px;
    top: 14px;
    width: 290px;
  }
  .phone-wrap::before {
    content: "";
    position: absolute;
    inset: 8% 8%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity: 0.45;
    filter: blur(50px);
    z-index: 0;
  }
  /* Fertiges Mock-up aus scripts/geraete-mockups/: Screenshot im echten
     Apple-Rahmen. Vorher zeichnete dieses Template den Rahmen selbst nach,
     wodurch das Vorschaubild anders aussah als die Seite, auf die es
     verweist. */
  .phone-wrap img {
    position: relative;
    z-index: 1;
    width: 100%;
    display: block;
  }
</style>
</head>
<body>

  <div class="dot-grid"></div>

  <div class="wordmark">
    <img src="../../assets/app-icon.png" alt="" />
    <span>12 CHALLENGES</span>
  </div>

  <div class="headline">{{HEADLINE}}</div>
  <div class="sub">{{SUBTEXT}}</div>

  <div class="phone-wrap">
    <img src="../../assets/{{SCREENSHOT}}" alt="" />
  </div>

</body>
</html>
