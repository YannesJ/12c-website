de:
  faq:
    - question: "Wie funktioniert ein Gewohnheitstracker auf der Apple Watch?"
      answer: "Du nimmst dir eine Gewohnheit vor und hakst auf der Uhr ab, wenn du dein Tagesziel erreicht hast. Bei 12 Challenges legst du dafür eine Monats-Challenge auf dem iPhone an. Auf der Apple Watch siehst du, was heute noch offen ist und an wie vielen Tagen du dein Ziel bereits erreicht hast."
    - question: "Brauche ich ein iPhone für 12 Challenges auf der Apple Watch?"
      answer: "Ja. Du brauchst ein gekoppeltes iPhone mit 12 Challenges. Dort legst du deine Challenges an und bearbeitest sie. Die Watch-App zeigt deine laufenden Ziele an und lässt dich erledigte Tage direkt auf der Uhr abhaken."
    - question: "Kann ich auch abhaken, wenn mein iPhone gerade nicht erreichbar ist?"
      answer: "Ja, wenn deine Challenges vorher auf die Watch übertragen wurden. Du kannst sie dann auf der Uhr abhaken. Sobald die Verbindung wieder möglich ist, werden die Einträge mit dem iPhone abgeglichen. Für die erste Einrichtung müssen die Geräte miteinander verbunden sein."
    - question: "Kann ich mehrere Gewohnheiten gleichzeitig auf der Apple Watch verfolgen?"
      answer: "Ja. Die App zeigt deine laufenden Challenges in einer Liste. Zu jedem Ziel siehst du den Fortschritt und ob es heute schon abgehakt ist. Sobald alle Ziele für heute erledigt sind, erscheint „Für heute geschafft!“."
    - question: "Welche Komplikationen gibt es für das Zifferblatt?"
      answer: "Du kannst deinen Fortschritt oder deine aktuelle Serie, den Streak, anzeigen lassen. Bei einer Challenge zeigt der Fortschrittsring die erledigten Tage dieser Challenge. Bei mehreren Challenges zeigt er, wie viele Ziele du heute abgehakt hast. Beide Komplikationen gibt es für runde und rechteckige Plätze sowie für die Ecken geeigneter Zifferblätter."
    - question: "Werden Gewohnheiten automatisch über Apple Health erfasst?"
      answer: "Nein. Du hakst selbst ab, wenn du dein Tagesziel erreicht hast. So kannst du auch Gewohnheiten festhalten, die deine Uhr nicht messen kann: zum Beispiel Lesen, Tagebuchschreiben oder weniger Zeit in sozialen Medien."
    - question: "Was ist der Unterschied zu den Aktivitätsringen der Apple Watch?"
      answer: "Die Aktivitätsringe zeigen deine Bewegung im Alltag. In 12 Challenges bestimmst du selbst, welche Gewohnheiten du verfolgen möchtest – etwa täglich lesen, meditieren oder auf Zucker verzichten. Du bestätigst selbst, ob du dein Ziel erreicht hast. Die App übernimmt keine Gesundheits- oder Trainingsdaten automatisch."
en:
  faq:
    - question: "How does a habit tracker on Apple Watch work?"
      answer: "Choose a habit and check it off on your watch when you have met your daily goal. In 12 Challenges, you create a monthly challenge on your iPhone. Your Watch shows what is left today and how many days you have completed."
    - question: "Do I need an iPhone for 12 Challenges on Apple Watch?"
      answer: "Yes. You need a paired iPhone with 12 Challenges installed. Create and edit challenges there; use the Watch app to view active goals and check off completed days."
    - question: "Can I check off a goal when my iPhone is out of reach?"
      answer: "Yes, if your challenges have already been transferred to the watch. You can check them off there, and entries sync when communication with your iPhone is available again. The devices need a connection for the initial setup."
    - question: "Can I track several habits at once on Apple Watch?"
      answer: "Yes. Active challenges appear in a list with their progress and today's check-off status. Once every goal is completed, the app shows “Done for today!”."
    - question: "Which watch face complications are available?"
      answer: "You can display progress or your current streak. With one challenge, the progress ring shows its completed days. With several challenges, it shows how many goals you have checked off today. Both complications support circular, rectangular and corner slots on compatible watch faces."
    - question: "Are habits recorded automatically through Apple Health?"
      answer: "No. You check off your goal yourself. This also works for habits your watch cannot measure, such as reading, journaling or spending less time on social media."
    - question: "How is this different from Apple Watch Activity rings?"
      answer: "Activity rings show your daily physical activity. With 12 Challenges, you choose your own habits, such as reading, meditation or avoiding sugar, and confirm completion yourself. The app does not automatically import health or workout data."
fr:
  faq:
    - question: "Comment fonctionne le suivi d’habitudes sur Apple Watch ?"
      answer: "Choisis une habitude et coche la journée sur ta montre lorsque tu as atteint ton objectif. Dans 12 Challenges, tu crées un challenge mensuel sur l’iPhone. La Watch montre ce qu’il reste à faire aujourd’hui et le nombre de jours accomplis."
    - question: "Ai-je besoin d’un iPhone pour utiliser 12 Challenges sur Apple Watch ?"
      answer: "Oui. Il te faut un iPhone jumelé avec 12 Challenges installé. Tu y crées et modifies tes challenges. Sur la montre, tu consultes les objectifs en cours et coches les jours accomplis."
    - question: "Puis-je cocher un objectif si mon iPhone n’est pas à portée ?"
      answer: "Oui, si les challenges ont déjà été transférés sur la montre. Tu peux les cocher et les entrées seront synchronisées lorsque l’iPhone sera de nouveau accessible. Pour la première installation, les appareils doivent être connectés."
    - question: "Puis-je suivre plusieurs habitudes sur Apple Watch ?"
      answer: "Oui. Les challenges en cours apparaissent dans une liste avec leur progression et la coche du jour. Lorsque tous les objectifs sont accomplis, l’app affiche « C’est fait pour aujourd’hui ! »."
    - question: "Quelles complications sont disponibles ?"
      answer: "Tu peux afficher la progression ou ta série de jours consécutifs. Avec un challenge, l’anneau montre les jours accomplis. Avec plusieurs challenges, il montre combien d’objectifs sont cochés aujourd’hui. Les deux complications sont compatibles avec les emplacements circulaires, rectangulaires et dans les coins des cadrans adaptés."
    - question: "Les habitudes sont-elles enregistrées automatiquement via Apple Santé ?"
      answer: "Non. Tu coches toi-même ton objectif. Cela fonctionne aussi pour les habitudes que la montre ne peut pas mesurer, comme la lecture, le journal personnel ou moins de temps sur les réseaux sociaux."
    - question: "Quelle est la différence avec les anneaux d’activité de l’Apple Watch ?"
      answer: "Les anneaux d’activité suivent tes mouvements au quotidien. Dans 12 Challenges, tu choisis tes propres habitudes, comme lire, méditer ou éviter le sucre, et tu confirmes toi-même leur réalisation. L’app n’importe pas automatiquement les données de santé ou d’entraînement."
es:
  faq:
    - question: "¿Cómo funciona una app de hábitos en el Apple Watch?"
      answer: "Elige un hábito y márcalo en el reloj cuando hayas cumplido el objetivo del día. En 12 Challenges creas un reto mensual en el iPhone. El Watch muestra lo que falta hoy y cuántos días has completado."
    - question: "¿Necesito un iPhone para usar 12 Challenges en el Apple Watch?"
      answer: "Sí. Necesitas un iPhone enlazado con 12 Challenges instalado. Allí creas y editas los retos. En el reloj puedes ver los objetivos activos y marcar los días completados."
    - question: "¿Puedo marcar un objetivo si mi iPhone no está al alcance?"
      answer: "Sí, si los retos se han transferido antes al reloj. Puedes marcarlos y los registros se sincronizarán cuando el iPhone vuelva a estar disponible. Para la configuración inicial, los dispositivos deben estar conectados."
    - question: "¿Puedo seguir varios hábitos a la vez en el Apple Watch?"
      answer: "Sí. Los retos activos aparecen en una lista con su progreso y el estado de hoy. Cuando todos los objetivos están completados, la app muestra «¡Hecho por hoy!»."
    - question: "¿Qué complicaciones están disponibles para la esfera?"
      answer: "Puedes mostrar el progreso o tu racha. Con un reto, el anillo muestra sus días completados. Con varios, indica cuántos objetivos has marcado hoy. Ambas complicaciones admiten espacios circulares, rectangulares y en las esquinas de las esferas compatibles."
    - question: "¿Se registran los hábitos automáticamente a través de Salud de Apple?"
      answer: "No. Tú marcas el objetivo cuando lo cumples. Así puedes registrar hábitos que el reloj no mide, como leer, escribir un diario o dedicar menos tiempo a las redes sociales."
    - question: "¿En qué se diferencia de los anillos de actividad del Apple Watch?"
      answer: "Los anillos de actividad muestran tu movimiento diario. En 12 Challenges eliges tus propios hábitos, como leer, meditar o evitar el azúcar, y confirmas que los has cumplido. La app no importa automáticamente datos de salud ni de entrenamientos."
it:
  faq:
    - question: "Come funziona un tracker di abitudini su Apple Watch?"
      answer: "Scegli un’abitudine e spunta la giornata sull’orologio quando hai raggiunto il tuo obiettivo. In 12 Challenges crei una sfida mensile sull’iPhone. Il Watch mostra cosa manca oggi e quanti giorni hai completato."
    - question: "Serve un iPhone per usare 12 Challenges su Apple Watch?"
      answer: "Sì. Serve un iPhone abbinato con 12 Challenges installato. Lì crei e modifichi le sfide. Sull’orologio vedi gli obiettivi in corso e spunti i giorni completati."
    - question: "Posso spuntare un obiettivo se l’iPhone non è raggiungibile?"
      answer: "Sì, se le sfide sono già state trasferite sull’orologio. Puoi spuntarle e i dati si sincronizzeranno quando l’iPhone sarà di nuovo raggiungibile. Per la configurazione iniziale i dispositivi devono essere connessi."
    - question: "Posso seguire più abitudini su Apple Watch?"
      answer: "Sì. Le sfide in corso sono elencate con i progressi e la spunta di oggi. Quando tutti gli obiettivi sono completati, l’app mostra «Per oggi è fatta!»."
    - question: "Quali complicazioni sono disponibili per il quadrante?"
      answer: "Puoi mostrare i progressi o la tua serie di giorni consecutivi. Con una sfida, l’anello mostra i giorni completati. Con più sfide, indica quanti obiettivi hai spuntato oggi. Entrambe le complicazioni supportano posizioni circolari, rettangolari e negli angoli dei quadranti compatibili."
    - question: "Le abitudini vengono registrate automaticamente tramite Apple Salute?"
      answer: "No. Spunti tu l’obiettivo quando lo raggiungi. Puoi così registrare anche abitudini che l’orologio non misura, come leggere, tenere un diario o usare meno i social."
    - question: "Qual è la differenza rispetto agli anelli Attività di Apple Watch?"
      answer: "Gli anelli Attività mostrano il movimento quotidiano. In 12 Challenges scegli le tue abitudini, come leggere, meditare o evitare lo zucchero, e confermi tu di averle completate. L’app non importa automaticamente dati sulla salute o sugli allenamenti."
pt:
  faq:
    - question: "Como funciona o acompanhamento de hábitos no Apple Watch?"
      answer: "Escolhe um hábito e assinala o dia no relógio quando cumprires o teu objetivo. No 12 Challenges, crias um desafio mensal no iPhone. O Watch mostra o que falta hoje e quantos dias já concluíste."
    - question: "Preciso de um iPhone para usar o 12 Challenges no Apple Watch?"
      answer: "Sim. Precisas de um iPhone emparelhado com o 12 Challenges instalado. Nele crias e editas os desafios. No relógio, vês os objetivos em curso e assinalas os dias concluídos."
    - question: "Posso assinalar um objetivo quando o iPhone não está ao alcance?"
      answer: "Sim, desde que os desafios já tenham sido transferidos para o relógio. Podes assinalá-los, e os registos serão sincronizados quando o iPhone estiver novamente disponível. Para a configuração inicial, os dispositivos têm de estar ligados."
    - question: "Posso acompanhar vários hábitos ao mesmo tempo no Apple Watch?"
      answer: "Sim. Os desafios em curso aparecem numa lista com o progresso e o estado de hoje. Quando todos os objetivos estão concluídos, a app mostra «Feito por hoje!»."
    - question: "Quais são as complicações disponíveis para o mostrador?"
      answer: "Podes mostrar o progresso ou a tua sequência de dias. Com um desafio, o anel mostra os dias concluídos. Com vários, indica quantos objetivos assinalaste hoje. As duas complicações suportam posições circulares, retangulares e nos cantos de mostradores compatíveis."
    - question: "Os hábitos são registados automaticamente pela app Saúde da Apple?"
      answer: "Não. És tu que assinalas o objetivo quando o cumpres. Assim podes registar hábitos que o relógio não mede, como ler, escrever um diário ou passar menos tempo nas redes sociais."
    - question: "Qual é a diferença em relação aos anéis de Atividade do Apple Watch?"
      answer: "Os anéis de Atividade mostram o teu movimento diário. No 12 Challenges, escolhes os teus hábitos, como ler, meditar ou evitar açúcar, e confirmas quando os realizas. A app não importa automaticamente dados de saúde ou de treinos."
tr:
  faq:
    - question: "Apple Watch’ta alışkanlık takibi nasıl çalışır?"
      answer: "Bir alışkanlık seç ve günlük hedefine ulaştığında saatinde işaretle. 12 Challenges’ta iPhone üzerinde aylık bir hedef oluşturursun. Watch, bugün nelerin kaldığını ve kaç günü tamamladığını gösterir."
    - question: "Apple Watch’ta 12 Challenges için iPhone gerekiyor mu?"
      answer: "Evet. 12 Challenges yüklü, eşlenmiş bir iPhone gerekir. Hedeflerini orada oluşturur ve düzenlersin. Saatte devam eden hedeflerini görür, tamamladığın günleri işaretlersin."
    - question: "iPhone’um erişilebilir değilken bir hedefi işaretleyebilir miyim?"
      answer: "Evet, hedeflerin daha önce saate aktarılmışsa işaretleyebilirsin. iPhone yeniden erişilebilir olduğunda kayıtlar eşzamanlanır. İlk kurulum için cihazların birbirine bağlı olması gerekir."
    - question: "Apple Watch’ta birden fazla alışkanlık takip edebilir miyim?"
      answer: "Evet. Devam eden hedeflerin, ilerlemeleri ve bugünkü durumlarıyla bir listede görünür. Tüm hedefler tamamlandığında uygulama “Bugünlük tamam!” mesajını gösterir."
    - question: "Kadran için hangi komplikasyonlar var?"
      answer: "İlerlemeyi veya güncel serini gösterebilirsin. Tek hedefte halka, tamamlanan günleri gösterir. Birden fazla hedefte bugün kaç hedefi işaretlediğini gösterir. İki komplikasyon da uygun kadranlarda yuvarlak, dikdörtgen ve köşe alanlarını destekler."
    - question: "Alışkanlıklar Apple Sağlık üzerinden otomatik kaydedilir mi?"
      answer: "Hayır. Hedefini tamamladığında kendin işaretlersin. Böylece kitap okumak, günlük yazmak veya sosyal medyada daha az zaman geçirmek gibi saatin ölçemediği alışkanlıkları da kaydedebilirsin."
    - question: "Apple Watch Aktivite halkalarından farkı ne?"
      answer: "Aktivite halkaları günlük hareketini gösterir. 12 Challenges’ta okumak, meditasyon yapmak veya şekerden uzak durmak gibi alışkanlıkları kendin seçer ve tamamladığında onaylarsın. Uygulama sağlık veya antrenman verilerini otomatik olarak içe aktarmaz."
pl:
  faq:
    - question: "Jak działa śledzenie nawyków na Apple Watch?"
      answer: "Wybierz nawyk i odhacz go na zegarku, gdy wykonasz dzisiejszy cel. W 12 Challenges tworzysz miesięczne wyzwanie na iPhonie. Watch pokazuje, co zostało na dziś i ile dni udało się ukończyć."
    - question: "Czy do 12 Challenges na Apple Watch potrzebuję iPhone’a?"
      answer: "Tak. Potrzebujesz sparowanego iPhone’a z 12 Challenges. Na nim tworzysz i edytujesz wyzwania. Na zegarku widzisz aktywne cele i odhaczasz ukończone dni."
    - question: "Czy mogę odhaczyć cel, gdy iPhone jest poza zasięgiem?"
      answer: "Tak, jeśli wyzwania zostały wcześniej przesłane na zegarek. Możesz je odhaczyć, a wpisy zsynchronizują się, gdy iPhone znów będzie dostępny. Przy pierwszej konfiguracji urządzenia muszą być połączone."
    - question: "Czy na Apple Watch mogę śledzić kilka nawyków naraz?"
      answer: "Tak. Aktywne wyzwania pojawiają się na liście wraz z postępem i dzisiejszym stanem. Po ukończeniu wszystkich celów aplikacja pokazuje „Na dziś zrobione!”."
    - question: "Jakie komplikacje można dodać do tarczy?"
      answer: "Możesz wyświetlać postęp albo aktualną serię. Przy jednym wyzwaniu pierścień pokazuje ukończone dni. Przy kilku — liczbę celów odhaczonych dzisiaj. Obie komplikacje obsługują okrągłe i prostokątne miejsca oraz narożniki zgodnych tarcz."
    - question: "Czy nawyki zapisują się automatycznie przez Apple Zdrowie?"
      answer: "Nie. Samodzielnie odhaczasz wykonanie celu. Dzięki temu możesz zapisywać też czynności, których zegarek nie mierzy, jak czytanie, pisanie dziennika czy ograniczenie czasu w mediach społecznościowych."
    - question: "Czym to się różni od pierścieni Aktywności Apple Watch?"
      answer: "Pierścienie Aktywności pokazują codzienny ruch. W 12 Challenges wybierasz własne nawyki, jak czytanie, medytacja czy rezygnacja z cukru, i samodzielnie potwierdzasz ich wykonanie. Aplikacja nie importuje automatycznie danych zdrowotnych ani treningowych."
el:
  faq:
    - question: "Πώς λειτουργεί η παρακολούθηση συνηθειών στο Apple Watch;"
      answer: "Διάλεξε μια συνήθεια και σημείωσέ την στο ρολόι όταν πετύχεις τον καθημερινό στόχο. Στο 12 Challenges δημιουργείς μια μηνιαία πρόκληση στο iPhone. Το Watch δείχνει τι απομένει για σήμερα και πόσες ημέρες έχεις ολοκληρώσει."
    - question: "Χρειάζομαι iPhone για το 12 Challenges στο Apple Watch;"
      answer: "Ναι. Χρειάζεσαι ένα ζευγοποιημένο iPhone με το 12 Challenges. Εκεί δημιουργείς και επεξεργάζεσαι τις προκλήσεις. Στο ρολόι βλέπεις τους ενεργούς στόχους και σημειώνεις τις ολοκληρωμένες ημέρες."
    - question: "Μπορώ να σημειώσω έναν στόχο όταν το iPhone δεν είναι προσβάσιμο;"
      answer: "Ναι, εφόσον οι προκλήσεις έχουν ήδη μεταφερθεί στο ρολόι. Μπορείς να τις σημειώσεις και οι καταχωρίσεις θα συγχρονιστούν όταν το iPhone γίνει ξανά προσβάσιμο. Για την πρώτη ρύθμιση οι συσκευές πρέπει να είναι συνδεδεμένες."
    - question: "Μπορώ να παρακολουθώ πολλές συνήθειες στο Apple Watch;"
      answer: "Ναι. Οι ενεργές προκλήσεις εμφανίζονται σε λίστα με την πρόοδο και τη σημερινή τους κατάσταση. Όταν ολοκληρωθούν όλοι οι στόχοι, η εφαρμογή δείχνει «Για σήμερα τελείωσες!»."
    - question: "Ποιες πολυπλοκότητες υπάρχουν για την πρόσοψη;"
      answer: "Μπορείς να εμφανίζεις την πρόοδο ή το τρέχον σερί. Με μία πρόκληση ο κύκλος δείχνει τις ολοκληρωμένες ημέρες της. Με πολλές δείχνει πόσους στόχους σημείωσες σήμερα. Και οι δύο πολυπλοκότητες υποστηρίζουν κυκλικές, ορθογώνιες και γωνιακές θέσεις σε συμβατές προσόψεις."
    - question: "Καταγράφονται αυτόματα οι συνήθειες μέσω του Apple Υγεία;"
      answer: "Όχι. Σημειώνεις εσύ τον στόχο όταν τον πετύχεις. Έτσι μπορείς να καταγράφεις και συνήθειες που το ρολόι δεν μετρά, όπως διάβασμα, ημερολόγιο ή λιγότερο χρόνο στα κοινωνικά δίκτυα."
    - question: "Ποια είναι η διαφορά από τους κύκλους Δραστηριότητας του Apple Watch;"
      answer: "Οι κύκλοι Δραστηριότητας δείχνουν την καθημερινή σου κίνηση. Στο 12 Challenges επιλέγεις τις δικές σου συνήθειες, όπως διάβασμα, διαλογισμό ή αποφυγή ζάχαρης, και επιβεβαιώνεις εσύ την ολοκλήρωσή τους. Η εφαρμογή δεν εισάγει αυτόματα δεδομένα υγείας ή προπονήσεων."
